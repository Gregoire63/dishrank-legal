<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DishRank — Connexion</title>
  <style>
    body { background: #1A1832; color: #EEEEF0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { text-align: center; padding: 40px; max-width: 360px; }
    img { width: 80px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #B0B0C0; font-size: 14px; margin: 0 0 24px; }
    .spinner { width: 28px; height: 28px; border: 3px solid #353355; border-top-color: #FF6B35; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback { display: none; margin-top: 24px; }
    .fallback a { display: inline-block; padding: 12px 28px; background: #FF6B35; color: #fff; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; }
  </style>
  <script>
    // Extract tokens from URL hash and redirect to the app
    var hash = window.location.hash;
    if (hash && hash.includes('access_token')) {
      // Redirect to app scheme with tokens
      window.location.replace('dishrank://auth/callback' + hash);
      // Show fallback button after 3s if redirect didn't work
      setTimeout(function() {
        document.getElementById('fallback').style.display = 'block';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').textContent = 'Redirection impossible';
        document.getElementById('desc').textContent = "Ouvrez l'application DishRank pour terminer la connexion.";
      }, 3000);
    } else {
      // No tokens, redirect to home
      window.location.replace('https://dishrank.fr');
    }
  </script>
</head>
<body>
  <div class="card">
    <img src="https://yztbhdvrvgozhyaujtjz.supabase.co/storage/v1/object/public/assets/logo.png" alt="DishRank">
    <h1 id="status">Connexion en cours...</h1>
    <p id="desc">Vous allez etre redirige vers l'application.</p>
    <div id="spinner" class="spinner"></div>
    <div id="fallback" class="fallback">
      <a href="https://play.google.com/store/apps/details?id=com.dishrank.app">Ouvrir DishRank</a>
    </div>
  </div>
</body>
</html>
